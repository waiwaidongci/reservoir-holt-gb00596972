name: pump-calibration-gb0059
x-runtime: &runtime
  DATABASE_URL: 'postgresql+psycopg://analytics:${DB_PASSWORD:-analytics-demo-2611}@db:5432/analytics'
  JWT_SECRET: ${JWT_SECRET:-local-demo-pump-calibration-gb0059-signing-2611-only}
  SEED_DEMO: ${SEED_DEMO:-true}
  ARTIFACT_DIR: /artifacts
services:
  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-pump-calibration-gb0059}-frontend
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-18278}:80'
    depends_on: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1/healthz']
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    image: pump-calibration-gb0059-runtime:local
    container_name: ${COMPOSE_PROJECT_NAME:-pump-calibration-gb0059}-backend
    environment: *runtime
    volumes: [artifacts:/artifacts]
    ports:
      - '127.0.0.1:${BACKEND_PORT:-19278}:8000'
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 35
  db:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-pump-calibration-gb0059}-db
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: ${DB_PASSWORD:-analytics-demo-2611}
    ports:
      - '127.0.0.1:${DB_PORT:-17778}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, analytics, -d, analytics]
      interval: 3s
      timeout: 4s
      retries: 45
volumes:
  db-data: {}
  artifacts: {}
networks:
  default:
    ipam:
      config:
        - subnet: ${APP_SUBNET:-10.253.78.16/28}
